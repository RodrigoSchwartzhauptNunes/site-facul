{% extends "base.html" %}
{% block title %}Fase {{ fase }} - PoliticIA{% endblock %}
{% block content %}

<h2>Fase {{ fase }}/10</h2>
<p>Essa imagem é real ou feita por IA?</p>

<img src="{{ url_for('static', filename='img/' + imagem) }}" alt="Imagem do jogo">

<div class="btn-container">

  <button class="btn"
    onclick="window.location.href='{{ url_for('responder', resposta='real') }}'">
    REAL
  </button>

  <button class="btn btn-blue"
    onclick="window.location.href='{{ url_for('responder', resposta='ia') }}'">
    IA
  </button>

</div>

{% endblock %}
