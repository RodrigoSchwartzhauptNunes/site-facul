version: "3.9"

services:

  web:
    build: ./web
    container_name: politicia_web
    expose:
      - "8080"
    restart: always

  nginx:
    image: nginx:latest
    container_name: politicia_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html
      - ./web/static:/app/static
    depends_on:
      - web
    restart: always